const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

let lastNow=performance.now();
function loop(now){

function vPlayFile(){ const el=document.getElementById("vEl"), k=VID.q[VID.qi]; if(k===undefined){ return; }
  el.src=BOOK.videos[k-1]; el.currentTime=0; document.getElementById("vT").textContent=`p.${k} · ${TITLES[k-1]} · 요약 영상`; const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
function vOpen(){ if(BOOK.videos){ VID.q=vPages().filter(k=>BOOK.videos[k-1]); VID.qi=0; if(VID.q.length){ VID.on=true; document.getElementById("vid").hidden=false; document.getElementById("vCv").style.display="none"; const el=document.getElementById("vEl"); el.style.display="block"; vPlayFile(); return; } }
  document.getElementById("vCv").style.display="block"; document.getElementById("vEl").style.display="none"; VID.list=vBuild(); VID.t0=performance.now(); VID.on=true; VID.lastScene=-1; document.getElementById("vid").hidden=false;
  const [f]=steps[si]; document.getElementById("vT").textContent = f===0||f===NL? BOOK.title+" · 요약 영상" : pagesOf(f)+" · 페이지 요약 영상";
  if(!VID.off){VID.off=document.createElement("canvas"); VID.off.width=TW; VID.off.height=TH;}
  cancelAnimationFrame(VID.raf); VID.raf=requestAnimationFrame(vFrame); }
function vClose(){ try{document.getElementById("vEl").pause()}catch(e){} VID.on=false; cancelAnimationFrame(VID.raf); document.getElementById("vid").hidden=true; try{speechSynthesis.cancel()}catch(e){} }
function typeRich(g,txt,x,y,maxW,size,n,col,hi){ // *강조* -> accent highlight, typed to n chars, wraps
  g.font=FN(700,size); let cx=x, cy=y, em=false, cnt=0; const lh=size*1.35;
  const parts=txt.split(/(\*)/);
  for(const p of parts){ if(p==="*"){em=!em;continue;}
    for(const ch of p){ if(cnt>=n) return; const w=g.measureText(ch).width; if(cx+w>x+maxW&&ch!==" "){cx=x;cy+=lh;}
      if(em){g.fillStyle=hi;g.globalAlpha=.9;g.fillRect(cx-1,cy+size*.12,w+2,size*.22);g.globalAlpha=1;}
      g.fillStyle=em?hi:col; g.fillText(ch,cx,cy); cx+=w; cnt++; } } }
function vFrame(now){
  if(!VID.on) return; VID.raf=requestAnimationFrame(vFrame); if(!VID.list.length) return;
  const cv=document.getElementById("vCv"), g=cv.getContext("2d"), t=Math.max(0,(now-VID.t0)/1000), N=VID.list.length, total=N*SCN;
  const idx=Math.min(N-1,Math.floor(t/SCN)), ts=t-idx*SCN, S=VID.list[idx];
  document.getElementById("vBar").style.width=Math.min(100,t/total*100)+"%";
  if(idx!==VID.lastScene){VID.lastScene=idx; vSay(S.h+". "+S.b+". "+S.c);}
  // background
  const bg=g.createLinearGradient(0,0,1280,720); bg.addColorStop(0,"#13355A"); bg.addColorStop(1,INK); g.fillStyle=bg; g.fillRect(0,0,1280,720);
  g.globalAlpha=.06; for(let i=0;i<14;i++){g.fillStyle="#fff";g.beginPath();g.arc((i*173+t*18)%1400-60,(i*97)%720,40+i%5*18,0,7);g.fill();} g.globalAlpha=1;
  // page visual (live graphs replay with the scene)
  const pageK=S.k, pt=t-VID.list.findIndex(x=>x.k===pageK)*SCN;
  const og=VID.off.getContext("2d"); og.setTransform(1,0,0,1,0,0); og.globalAlpha=1;
  if(pageK===0) og.drawImage(FACE[0].st||FACE[0].cv,0,0,TW,TH); else if(P[pageK-1]){ og.save(); P[pageK-1](og,Math.max(0,pt)); og.restore(); } else og.drawImage(FACE[pageK].st||FACE[pageK].cv,0,0,TW,TH);
  const LANDP=TW>TH, ph=LANDP?380:640, pw=ph*TW/TH, px=LANDP?60:70, py=LANDP?300:40;
  const z=1+.25*eO(Math.min(1,ts/SCN)), fy=(idx%2)*.35; // slow push-in
  g.save(); g.shadowColor="rgba(0,0,0,.5)"; g.shadowBlur=40; g.shadowOffsetY=18; R(g,px,py,pw,ph,14); g.fillStyle="#fff"; g.fill(); g.restore();
  g.save(); R(g,px,py,pw,ph,14); g.clip(); const sw=TW/z, sh=TH/z, sx=(TW-sw)/2, sy=(TH-sh)*fy; g.drawImage(VID.off,sx,sy,sw,sh,px,py,pw,ph); g.restore();
  // text
  const tx=LANDP?60:px+pw+60, tw=LANDP?1160:1280-tx-60, ty=LANDP?90:150;
  const tag=pageK===0?"SUMMARY":("PAGE "+String(pageK).padStart(2,"0")); g.fillStyle=ACC; g.fillRect(tx,ty-50,60,6); T(g,tag+"  ·  "+(pageK?TITLES[pageK-1]:BOOK.title),tx,ty-14,FN(700,20),"rgba(255,255,255,.75)");
  const a1=eO(cl(ts/.5)); g.globalAlpha=a1; T(g,S.h,tx,ty+44,FN(900,LANDP?40:44),"#fff"); g.globalAlpha=1;
  typeRich(g,S.b,tx,ty+(LANDP?110:130),tw,LANDP?30:34,Math.floor(Math.max(0,ts-.5)*22),"rgba(255,255,255,.95)",ACC);
  g.globalAlpha=eO(cl((ts-1.6)/.6)); g.font=FN(400,24); T(g,S.c,tx,LANDP?ty+230:ty+330,FN(400,24),"rgba(255,255,255,.7)"); g.globalAlpha=1;
  // dots + brand
  for(let i=0;i<N;i++){g.fillStyle=i===idx?ACC:"rgba(255,255,255,.3)";R(g,tx+i*26,LANDP?660:600,i===idx?20:10,8,4);g.fill();}
  if(LOGOW){const h=26,w=h*LOGOW.width/LOGOW.height; g.globalAlpha=.8; g.drawImage(LOGOW,1280-w-40,720-h-30,w,h); g.globalAlpha=1;}
  if(t>=total+.6){ VID.on=false; document.getElementById("vBar").style.width="100%"; }
}
document.getElementById("bVid").onclick=()=>{ closePanels(); vOpen(); };
document.getElementById("vClose").onclick=vClose;
document.getElementById("vRe").onclick=()=>vOpen();
(function(){const el=document.getElementById("vEl"); el.addEventListener("timeupdate",()=>{ if(!el.duration) return; const n=VID.q.length||1; document.getElementById("vBar").style.width=((VID.qi+el.currentTime/el.duration)/n*100)+"%"; });
 el.addEventListener("ended",()=>{ if(VID.qi<VID.q.length-1){ VID.qi++; vPlayFile(); } });})();
document.getElementById("vid").addEventListener("click",e=>{if(e.target.id==="vid")vClose();});

/* ---------- boot ---------- */
(async()=>{
  const wait=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
  try{ await wait(Promise.all(['900 150px "Noto Sans KR"','700 70px "Noto Sans KR"','500 40px "Noto Sans KR"','400 40px "Noto Sans KR"'].map(f=>document.fonts.load(f,"보고서가상AB"))),2500); }catch(e){}
  await wait(new Promise(res=>{const im=new Image(); im.onload=()=>{LOGO=im; try{LOGOW=whiteLogo(im);}catch(e){} res();}; im.onerror=res; im.src="logo.png";}),2500);
  try{
  const IM=await Promise.all((BOOK.imgs||[]).map(src=>src?wait(new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src;}),8000):null));
  const IMX=await Promise.all(["pages/cover.jpg","pages/back.jpg"].map(src=>wait(new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src;}),8000)));
  const ANIM={"2": [{"x": 120, "y": 1080, "w": 1260, "h": 250, "dir": "right", "d": 0}], "3": [{"x": 120, "y": 1096, "w": 1260, "h": 640, "dir": "up", "d": 0}], "5": [{"x": 120, "y": 1260, "w": 1260, "h": 560, "dir": "right", "d": 0}], "6": [{"x": 120, "y": 500, "w": 1260, "h": 940, "dir": "right", "d": 0}], "9": [{"x": 120, "y": 1330, "w": 1260, "h": 420, "dir": "right", "d": 0}]};
  const ldA=src=>wait(new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src;}),8000);
  const AB={},ACH={}; await Promise.all(Object.keys(ANIM).map(async k=>{const n=String(k).padStart(2,'0'); AB[k]=await ldA('anim/b'+n+'.jpg'); ACH[k]=await ldA('anim/c'+n+'.png');}));
  const easeA=x=>{x=x<0?0:x>1?1:x;return 1-Math.pow(1-x,3);};
  P=[]; Object.keys(ANIM).forEach(k=>{ if(!AB[k]||!ACH[k]) return; P[k-1]=(g,t)=>{ g.drawImage(AB[k],0,0,TW,TH); ANIM[k].forEach((r,i)=>{ const p=easeA((t-.35-r.d-i*.12)/1.2); if(p<=0) return; g.save(); g.beginPath();
    if(r.dir==='up') g.rect(r.x-6,r.y+r.h*(1-p)-6,r.w+12,r.h*p+12); else g.rect(r.x-6,r.y-6,r.w*p+12,r.h+12); g.clip(); g.drawImage(ACH[k],0,0,TW,TH); g.restore(); }); }; });
  makeFace(0,IMX[0]||drawCover()); for(let k=1;k<=NP;k++){ if(P[k-1]) makeFace(k); else makeFace(k, IM[k-1]||blankPage()); } makeFace(LAST,IMX[1]||drawBack());
  buildLeaves();
  const q=new URLSearchParams(location.search).get("s");
  si = q!==null ? Math.max(0,Math.min(steps.length-1,parseInt(q)||0)) : 0;
  curF=steps[si][0]; leaves.forEach((L,i)=>{L.p=L.to=i<curF?1:0; shapeLeaf(L,L.p);});
  if(curF>0&&curF<NL){ const n=performance.now(); anim[2*curF-1]=anim[2*curF]=n+300; }
  if(si>0) document.getElementById("hint").classList.add("off");
  label(); resize(); camTarget(performance.now()); Object.assign(cam,camT);
  requestAnimationFrame(loop);
  const ld=document.getElementById("load"); ld.style.opacity=0; setTimeout(()=>ld.remove(),600);
  }catch(err){ const ld=document.getElementById("load"); if(ld) ld.firstElementChild.textContent="표시 오류: "+err.message; console.error(err); }
})();
window.addEventListener("error",e=>{const ld=document.getElementById("load"); if(ld) ld.firstElementChild.textContent="표시 오류: "+e.message;});
</script>
