    var tgt = POSE_READ;
    pose.rx = POSE_COVER.rx * c + tgt.rx * (1 - c); pose.ry = POSE_COVER.ry * c + tgt.ry * (1 - c) + idle; pose.rz = POSE_COVER.rz * c + tgt.rz * (1 - c);
    pose.px = POSE_COVER.px * c + tgt.px * (1 - c); pose.py = POSE_COVER.py * c + tgt.py * (1 - c) + Math.sin(now / 1100) * .06 * c;
    ctx_ += (ptx - ctx_) * .08; cty_ += (pty - cty_) * .08; var rd = 1 - c;
    book.rotation.set(pose.rx - cty_ * .06 * rd + Math.sin(now / 2100) * .028 * rd, pose.ry + ctx_ * .10 * rd + Math.sin(now / 2700) * .06 * rd, pose.rz); book.position.set(pose.px, pose.py, 0);
    var d = camDist(c > .5), dk = 1 - Math.exp(-dt * 3); distNow += (d - distNow) * dk; if (Math.abs(distNow - d) > 50) distNow = d;
    camera.position.set(0, distNow * Math.sin(EL), distNow * Math.cos(EL)); camera.lookAt(0, 0, 0);
    book.updateMatrixWorld(true); deskBB.setFromObject(board); var dy = deskBB.min.y - .03;
    desk.position.y = dy; props.position.y = dy;
    deskSh.position.set((deskBB.min.x + deskBB.max.x) / 2 + 1.0, dy + .04, (deskBB.min.z + deskBB.max.z) / 2 + (deskBB.max.z - deskBB.min.z) * .22 + .4);
    deskSh.scale.set(deskBB.max.x - deskBB.min.x + 3.5, deskBB.max.z - deskBB.min.z + 3.5, 1);
    if (++deskChk % 20 === 1) { deskDark = deskIsDark(); deskMat.color.setHex(deskDark ? 0x5a5a62 : 0xffffff); }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  distNow = 30; resize(); distNow = camDist(true);

  // ----- ui -----
  var hint = $("hint");
  if (CFG.hint) hint.textContent = CFG.hint;
  function anyModal() { return !$("toc").hidden || !$("big").hidden || !$("orig").hidden || !$("vid").hidden; }
  function label() {
    $("lab").innerHTML = "<b>" + (cur + 1) + "</b> / " + N + " · " + TITLES[cur];
    $("prev").disabled = cur === 0; $("next").disabled = cur === N - 1; $("again").hidden = cur !== N - 1;
    var ch = $("tocGrid").children; for (var i = 0; i < ch.length; i++) ch[i].classList.toggle("now", i === cur);
  }
  function go(n, silent) {
    n = Math.max(0, Math.min(N - 1, n)); if (n === cur) return;
    ensureAudio(); if (!silent) { var steps = Math.min(3, Math.abs(n - cur)); for (var s = 0; s < steps; s++) (function (s) { setTimeout(function () { flipSound(); }, s * 140); })(s); }
    var old = cur; paint(old, 99); startT[n] = n < old ? performance.now() - 12000 : performance.now(); cur = n; label(); hint.classList.add("off");
  }
  $("next").addEventListener("click", function () { go(cur + 1); });
  $("prev").addEventListener("click", function () { go(cur - 1); });
  $("again").addEventListener("click", function () { go(0); });
  function closeAll() { $("toc").hidden = true; $("big").hidden = true; $("orig").hidden = true; closeVid(); }
  document.addEventListener("keydown", function (e) {
    if (anyModal()) { if (e.key === "Escape") closeAll(); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "PageDown" || e.key === " ") { go(cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown" || e.key === "PageUp") { go(cur - 1); e.preventDefault(); }
    else if (e.key === "Home") go(0); else if (e.key === "End") go(N - 1);
  });
  var sx = 0, sy = 0, sd = false, st = 0;
  cvs.addEventListener("pointerdown", function (e) { sd = true; sx = e.clientX; sy = e.clientY; st = performance.now(); });
  window.addEventListener("pointerup", function (e) {
    if (!sd) return; sd = false; var dx = e.clientX - sx, dy = e.clientY - sy, ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) > 36) { if (ay >= ax) go(cur + (dy < 0 ? 1 : -1)); else go(cur + (dx < 0 ? 1 : -1)); }
    else if (performance.now() - st < 400) { if (e.clientY > window.innerHeight * .5) go(cur + 1); else go(cur - 1); }
  });
  var wl = 0; cvs.addEventListener("wheel", function (e) { var n = performance.now(); if (n - wl < 450 || Math.abs(e.deltaY) < 8) return; wl = n; go(cur + (e.deltaY > 0 ? 1 : -1)); e.preventDefault(); }, { passive: false });
  var tg = $("tocGrid");
  TITLES.forEach(function (t, i) { var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.innerHTML = "<b>" + (i + 1) + "</b><span></span>"; b.lastChild.textContent = t; b.addEventListener("click", function () { $("toc").hidden = true; go(i); }); tg.appendChild(b); });
  $("tocBtn").addEventListener("click", function () { $("toc").hidden = false; });
  $("toc").addEventListener("click", function (e) { if (e.target === $("toc")) $("toc").hidden = true; });
  // big view: the animated page at its finished state
  $("bigBtn").addEventListener("click", function () { var oc = document.createElement("canvas"); oc.width = 1600; oc.height = 900; var og = oc.getContext("2d"); try { DRAW[cur](og, 99); } catch (e) {} $("bigImg").src = oc.toDataURL("image/jpeg", .92); $("bigT").textContent = (cur + 1) + " / " + N + " · " + TITLES[cur]; $("big").hidden = false; });
  $("bigClose").addEventListener("click", function () { $("big").hidden = true; });
  $("big").addEventListener("click", function (e) { if (e.target === $("big")) $("big").hidden = true; });
  // original document view: the source slide as it appears in the PPT
  var oi = 0;
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function showOrig(i) {
    oi = Math.max(0, Math.min(N - 1, i));
    $("origImg").src = CFG.origDir + "s" + pad(oi + 1) + ".jpg";
    $("origT").textContent = "원문 " + (oi + 1) + " / " + N + " · " + TITLES[oi];
    $("origPrev").disabled = oi === 0; $("origNext").disabled = oi === N - 1;
  }
  $("origBtn").addEventListener("click", function () { showOrig(cur); $("orig").hidden = false; });
  $("origPrev").addEventListener("click", function () { showOrig(oi - 1); });
  $("origNext").addEventListener("click", function () { showOrig(oi + 1); });
  $("origClose").addEventListener("click", function () { $("orig").hidden = true; });
  $("orig").addEventListener("click", function (e) { if (e.target === $("orig")) $("orig").hidden = true; });
  if (CFG.pptx) { var of = $("origFile"); of.href = CFG.pptx; of.hidden = false; }
  // video
  function closeVid() { var v = $("vidEl"); try { v.pause(); } catch (e) {} $("vid").hidden = true; }
  if (CFG.video) {
    $("vidBtn").hidden = false;
    $("vidBtn").addEventListener("click", function () { var v = $("vidEl"); if (!v.getAttribute("src")) { v.preload = "auto"; v.src = CFG.video; v.load(); } $("vid").hidden = false; try { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} });
    $("vidClose").addEventListener("click", closeVid);
    $("vid").addEventListener("click", function (e) { if (e.target === $("vid")) closeVid(); });
  }
  // sound
  var actx = null;
  function ensureAudio() { try { if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state !== "running") actx.resume(); } catch (e) {} }
  ["pointerdown", "touchstart", "mousedown", "keydown", "click"].forEach(function (ev) { window.addEventListener(ev, ensureAudio, { capture: true, passive: true }); });
  var nbuf = null;
  function flipSound() {
    if (muted || !actx) return; ensureAudio();
    try {
      if (!nbuf) { var n = Math.floor(actx.sampleRate * .5); nbuf = actx.createBuffer(1, n, actx.sampleRate); var d = nbuf.getChannelData(0); for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
      var s = actx.createBufferSource(); s.buffer = nbuf; var bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = .9;
      var g = actx.createGain(), t = actx.currentTime;
      bp.frequency.setValueAtTime(700, t); bp.frequency.exponentialRampToValueAtTime(3200, t + .32);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.55, t + .06); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
      s.connect(bp); bp.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + .45);
    } catch (e) {}
  }
  $("snd").addEventListener("click", function () { muted = !muted; $("snd").setAttribute("aria-pressed", String(!muted)); $("snd").style.opacity = muted ? .5 : 1; });
  try { var m = /[?&]s=(\d+)/.exec(location.search); if (m) { cur = Math.min(N - 1, +m[1]); fp = cur; } } catch (e) {}
  startT[0] = performance.now(); for (var z = 1; z < N; z++) startT[z] = performance.now() - 12000;
  if (cur) startT[cur] = performance.now() - 12000;
  redrawFinals();
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('400 20px "Noto Sans KR"'), document.fonts.load('700 20px "Noto Sans KR"')]).then(function () { redrawFinals(); }).catch(function () {});
  label(); requestAnimationFrame(frame);
})();
</script>
