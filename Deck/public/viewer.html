<html lang="ko">

<title>Deck</title>

:root[data-theme="dark"] { --veil: rgba(18,14,20,.58); }

  $("orig").addEventListener("click", function (e) { if (e.target === $("orig")) $("orig").hidden = true; });
  if (CFG.origFile) { var of = $("origFile"); of.href = CFG.origFile; of.textContent = u("origFile", "Open original file"); of.hidden = false; }

  // ----- video: a file if one is given, otherwise a short kinetic-type summary drawn live -----
  var SC = (CFG.scenes || []).filter(function (s) { return typeof s.i === "number" && DRAW[s.i]; }), vraf = 0, vt0 = 0, SCENE = 3.6, FADE = .45, rec = null;
  // The video plays the book's own pages: each one runs its entrance animation under a slow push-in,
  // with a short dip between pages. Nothing is typed out; the page is the picture.
  function vPage(g, s, lt) {
    var z = 1 + .035 * cl(lt / SCENE);
    g.save(); g.translate(800, 450); g.scale(z, z); g.translate(-800, -450);
    try { DRAW[s.i](g, lt); } catch (e) {}
    g.restore();
  }
  function vDraw(tt) {
    var g = $("vidCv").getContext("2d"), th = D.theme, total = SC.length * SCENE;
    if (!SC.length) return false;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = th.ink; g.fillRect(0, 0, 1600, 900);
    var si = Math.min(SC.length - 1, Math.floor(tt / SCENE)), lt = tt - si * SCENE;
    vPage(g, SC[si], Math.min(lt, SCENE + 2));
    // dip in and out of each page
    var a = Math.max(cl(1 - lt / FADE), si === SC.length - 1 ? 0 : cl((lt - (SCENE - FADE)) / FADE));
    if (si === 0) a = Math.min(a, cl(1 - lt / .25));
    if (a > 0) { g.globalAlpha = a; g.fillStyle = th.ink; g.fillRect(0, 0, 1600, 900); g.globalAlpha = 1; }
    g.fillStyle = th.hi; g.fillRect(0, 894, 1600 * cl(tt / total), 6);
    return tt < total + .8;
  }
  function vLoop(now) { var tt = (now - vt0) / 1000; var more = vDraw(tt); if (more) vraf = requestAnimationFrame(vLoop); else { vraf = 0; $("vidPlay").hidden = false; if (rec && rec.state === "recording") rec.stop(); } }
  function vStart() { cancelAnimationFrame(vraf); $("vidPlay").hidden = true; vt0 = performance.now(); vraf = requestAnimationFrame(vLoop); }
  function closeVid() { var v = $("vidEl"); try { v.pause(); } catch (e) {} cancelAnimationFrame(vraf); vraf = 0; if (rec && rec.state === "recording") rec.stop(); $("vid").hidden = true; }
  if (CFG.video || SC.length) {
    $("vidBtn").hidden = false;
    $("vidBtn").addEventListener("click", function () {
      $("vid").hidden = false;
      if (CFG.video) { var v = $("vidEl"); v.hidden = false; $("vidCv").hidden = true; if (!v.getAttribute("src")) { v.preload = "auto"; v.src = CFG.video; v.load(); } try { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} }
      else { $("vidEl").hidden = true; $("vidCv").hidden = false; $("vidSave").hidden = !(CFG.videoSave && window.MediaRecorder); vStart(); }
    });
    $("vidPlay").addEventListener("click", vStart);
    $("vidSave").addEventListener("click", function () {
      try {
        var chunks = [], stream = $("vidCv").captureStream(30), mt = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
        rec = new MediaRecorder(stream, { mimeType: mt, videoBitsPerSecond: 4e6 });
        rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
        rec.onstop = function () { var b = new Blob(chunks, { type: "video/webm" }); if (window.parent !== window) post({ type: "video", blob: b }); else { var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = (D.meta.t1 || "deck") + ".webm"; a.click(); } };
        rec.start(); $("vidSave").disabled = true; vStart();
        setTimeout(function () { $("vidSave").disabled = false; }, (SC.length * SCENE + 1.2) * 1000);
      } catch (e) { $("vidSave").hidden = true; }
    });
    $("vidClose").addEventListener("click", closeVid);
    $("vid").addEventListener("click", function (e) { if (e.target === $("vid")) closeVid(); });
  }

  // sound
  var actx = null;
  function ensureAudio() { try { if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state !== "running") actx.resume(); } catch (e) {} }
  ["pointerdown", "touchstart", "mousedown", "keydown", "click"].forEach(function (ev) { window.addEventListener(ev, ensureAudio, { capture: true, passive: true }); });
  var nbuf = null;
  function flipSound() {
    if (muted || !actx) return; ensureAudio();
    try {
      if (!nbuf) { var n = Math.floor(actx.sampleRate * .5); nbuf = actx.createBuffer(1, n, actx.sampleRate); var d = nbuf.getChannelData(0); for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
      var s = actx.createBufferSource(); s.buffer = nbuf; var bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = .9;
      var g = actx.createGain(), t = actx.currentTime;
      bp.frequency.setValueAtTime(700, t); bp.frequency.exponentialRampToValueAtTime(3200, t + .32);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.55, t + .06); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
      s.connect(bp); bp.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + .45);
    } catch (e) {}
  }
  $("snd").addEventListener("click", function () { muted = !muted; $("snd").setAttribute("aria-pressed", String(!muted)); $("snd").style.opacity = muted ? .5 : 1; });

  // messages from the editor
  window.addEventListener("message", function (e) {
    if (e.source !== window.parent || !e.data) return;
    var m = e.data;
    if (m.type === "go") go(m.page, true);
    if (m.type === "video" && !$("vidBtn").hidden) $("vidBtn").click();
    if (m.type === "render") {
      // Source page images must be decoded before they can be drawn.
      Promise.all(IMGS.map(function (im) { return im.decode ? im.decode().catch(function () {}) : null; })).then(function () {
        var out = [];
        for (var i = 0; i < N; i++) out.push(still(i, m.format === "png" ? "image/png" : "image/jpeg", m.quality || .9));
        post({ type: "rendered", id: m.id, images: out });
      });
    }
  });

  if (CFG.page) { cur = Math.min(N - 1, CFG.page); fp = cur; }
  startT[0] = performance.now(); for (var z = 1; z < N; z++) startT[z] = performance.now() - 12000;
  if (cur) startT[cur] = performance.now() - 12000;
  redrawFinals();
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('400 20px "Noto Sans KR"'), document.fonts.load('700 20px "Noto Sans KR"')]).then(function () { redrawFinals(); }).catch(function () {});
  label(); requestAnimationFrame(frame);

}
